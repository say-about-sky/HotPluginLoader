plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.saysky'
version = '0.2.0'

repositories {
    // 国内镜像优先(阿里云):public = Maven Central 聚合,google = Google Maven 镜像(R8/D8)
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    // 备用镜像(华为云,同样代理 Google 坐标)
    maven { url 'https://repo.huaweicloud.com/repository/maven/' }
    mavenCentral()
    // Finality loader 运行时(GPLv3,由 JitPack 从上游源码构建)
    // 限定 group,避免其它依赖也去 JitPack 查询(会明显变慢)
    maven {
        url 'https://jitpack.io'
        content { includeGroup 'com.github.Finality-Framework' }
    }
}

// ---------------------------------------------------------------------------
// 本地路径解析(全部在 Gradle 内完成,无外部脚本)
//   环境变量优先:  AOH_GAME_ROOT / ANDROID_HOME (或 ANDROID_SDK_ROOT) / JAVA_HOME
//   -P 覆盖:       -PgameRoot= -PandroidSdk= -PandroidJar= -Pd8Jar=
//   默认:          game root = 本工程上一级; android.jar = SDK 的 android-34(缺失则最新)
// ---------------------------------------------------------------------------
def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: findProperty('androidSdk')
def gameRoot = System.getenv('AOH_GAME_ROOT') ?: findProperty('gameRoot') ?: rootDir.parentFile

// libs\game.jar 优先(历史构建用它);缺失时回退 <游戏根>/game.jar
def libsGameJar = file('libs/game.jar')
def gameJar = libsGameJar.exists() ? libsGameJar : file("${gameRoot}/game.jar")

def pickFromSdk = { String subDir, String probe ->
    if (!sdkDir) return null
    def base = file("${sdkDir}/${subDir}")
    if (!base.isDirectory()) return null
    def hit = base.listFiles()
            ?.findAll { it.isDirectory() && new File(it, probe).exists() }
            ?.sort { a, b -> b.name <=> a.name }
    return hit ? new File(hit[0], probe) : null
}

def androidJarProp = findProperty('androidJar') as String
def androidJar = androidJarProp ? file(androidJarProp)
        : (sdkDir && file("${sdkDir}/platforms/android-34/android.jar").exists()
            ? file("${sdkDir}/platforms/android-34/android.jar")
            : pickFromSdk('platforms', 'android.jar'))

def d8JarProp = findProperty('d8Jar') as String
def d8Jar = d8JarProp ? file(d8JarProp)
        : (sdkDir && file("${sdkDir}/build-tools/35.0.0/lib/d8.jar").exists()
            ? file("${sdkDir}/build-tools/35.0.0/lib/d8.jar")
            : pickFromSdk('build-tools', 'lib/d8.jar'))

// 出补丁 dex 用的 loader 可执行包(与编译用的是同一坐标,Gradle 缓存复用)
configurations {
    loaderCli
}

dependencies {
    // ---- 公开坐标(自动下载，不进产物) ----
    // Finality loader 运行时：FinalityLogger / luminosity2 注解 / Mixin CallbackInfo 等
    compileOnly 'com.github.Finality-Framework:loader:1.6.0'
    loaderCli 'com.github.Finality-Framework:loader:1.6.0'

    // ---- 仅本地(不可再分发) ----
    // game.jar：游戏本体类(含 libGDX 核心)，与运行时版本一致，勿用 Maven 的 gdx 替代
    compileOnly files(gameJar)
    if (androidJar != null) {
        compileOnly files(androidJar)
    }

    // ---- 小体积、可再分发，随仓库提供 ----
    // 编译桩：androidx ContextCompat + gdx Android 后端 + team.rainfall.*(6 个空桩类)
    compileOnly files('libs/gdx-android-stubs.jar')
    // Finality API(Plugin 基类)
    compileOnly files('libs/finality-api-0.1.0.jar')

    // ---- 载荷：内置 D8 转换器，随补丁 dex 发布，必须打进产物 ----
    // 版本与 Android SDK build-tools 35 自带的 D8(8.6.2)对齐
    // 若镜像不可用，可改成 implementation files('<sdk>/build-tools/<ver>/lib/d8.jar')
    implementation 'com.android.tools:r8:8.6.27'
}

java {
    // 产物是 Java 8 字节码（游戏/安卓运行时目标）
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// ---------------------------------------------------------------------------
// JDK 11+ 发现（r8 8.6.x 的 class 文件版本是 55.0，JDK 8 的 javac 会报
// “类文件具有错误的版本 55.0, 应为 52.0”）
//   IDEA 的 Gradle JVM 经常是 JDK 8；Gradle 工具链在那种情况下又找不到 11，
//   所以这里自己找并 fork 指定的 javac，不依赖 toolchain / IDEA 设置。
//   顺序：-PjdkHome= > AOH_JDK > JAVA_HOME > Program Files 下的各个 JDK
// ---------------------------------------------------------------------------
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def jdkExe = { File home, String tool -> new File(home, "bin/${tool}${isWindows ? '.exe' : ''}") }
def isJdk = { File home -> home != null && jdkExe(home, 'javac').exists() }
def jdkMajorOf = { File home ->
    def rel = new File(home, 'release')
    if (rel.exists()) {
        def m = rel.text =~ /JAVA_VERSION="(\d+)/
        if (m.find()) return m.group(1) as int
    }
    return 0
}
def findJdk = { int minMajor ->
    def found = []
    def add = { String p -> if (p) { def f = file(p); if (isJdk(f)) found << f } }
    add(findProperty('jdkHome') as String)
    add(System.getenv('AOH_JDK'))
    add(System.getenv('JAVA_HOME'))
    ['C:/Program Files/Microsoft', 'C:/Program Files/Java', 'C:/Program Files/Eclipse Adoptium',
     'C:/Program Files/AdoptOpenJDK', 'C:/Program Files/Zulu', 'C:/Program Files/Amazon Corretto',
     'C:/Program Files/BellSoft', 'C:/Program Files/Android/Android Studio/jbr'].each { base ->
        def d = file(base)
        if (d.isDirectory()) d.listFiles()?.each { sub -> if (isJdk(sub)) found << sub }
    }
    // C:\Program Files\Java\latest\jdk-25 这类两层结构
    found.collect().each { j ->
        if (j.isDirectory()) j.listFiles()?.each { sub -> if (isJdk(sub)) found << sub }
    }
    found.unique().findAll { jdkMajorOf(it) >= minMajor }
            .sort { a, b -> jdkMajorOf(a) <=> jdkMajorOf(b) }
            .find()
}
def currentJvmMajor = {
    def m = System.getProperty('java.version') =~ /^(\d+)/
    m.find() ? (m.group(1) as int) : 0
}()
def jdk11Home = (currentJvmMajor >= 11 && isJdk(file(System.getProperty('java.home'))))
        ? file(System.getProperty('java.home')) : findJdk(11)

logger.info("compile jvm: ${System.getProperty('java.version')} / jdk11: ${jdk11Home}")

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (currentJvmMajor < 11) {
        if (jdk11Home == null) {
            doFirst {
                throw new GradleException("编译需要 JDK 11+（r8 载荷的 class 文件是 55.0）。\n" +
                        "  装一个 JDK 11，或用 -PjdkHome=<JDK目录> / 环境变量 AOH_JDK、JAVA_HOME 指定。")
            }
        } else {
            options.fork = true
            options.forkOptions.executable = jdkExe(jdk11Home, 'javac').absolutePath
        }
    }
}

jar { enabled = false }
shadowJar {
    archiveClassifier.set("")
    // 编译期依赖全部为 compileOnly，不会进入产物;这里只保留载荷(R8/D8)
}

// ---------------------------------------------------------------------------
// dex 任务：用 loader 的 patch 模式渲染补丁 dex → out/game.dex.zip
//   gradlew build      = jar + dex（一条命令出全套）
//   gradlew shadowJar  = 只出 jar
//   gradlew dex        = 只出 dex（复用已有 jar）
// ---------------------------------------------------------------------------
def dexOutDir = file("$projectDir/out")
def dexWorkDir = file("$buildDir/patch")
// 出 dex 同样需要 JDK 11+：复用上面找到的 jdk11Home（不跟着 IDEA 的 Gradle JVM 走）
def dexJavaHome = jdk11Home ?: file(System.getProperty('java.home'))

def toForwardSlash = { File f -> f.absolutePath.replace('\\', '/') }
def relTo = { File baseDir, File target ->
    try {
        return baseDir.toPath().toAbsolutePath().normalize()
                .relativize(target.toPath().toAbsolutePath().normalize())
                .toString().replace('\\', '/')
    } catch (Exception ignored) {
        return toForwardSlash(target)
    }
}

tasks.register('dex') {
    group = 'build'
    description = 'Render the patch dex with the Finality loader -> out/game.dex.zip'
    dependsOn tasks.named('shadowJar')

    def pluginJar = tasks.named('shadowJar').flatMap { it.archiveFile }
    inputs.file(pluginJar)
    outputs.file(new File(dexOutDir, 'game.dex.zip'))

    doLast {
        if (!gameJar.exists()) {
            throw new GradleException("game.jar not found: ${gameJar}\n" +
                    "  put your own game.jar next to this project, or set AOH_GAME_ROOT / -PgameRoot=<game dir>")
        }
        if (androidJar == null || !androidJar.exists()) {
            throw new GradleException('android.jar not found: set ANDROID_HOME (or -PandroidSdk=<sdk> / -PandroidJar=<jar>)')
        }
        if (d8Jar == null || !d8Jar.exists()) {
            throw new GradleException('d8.jar not found: set ANDROID_HOME / -Pd8Jar=<jar> (any build-tools/lib/d8.jar)')
        }

        dexWorkDir.mkdirs()
        dexOutDir.mkdirs()

        def cfgFile = new File(dexWorkDir, 'patch.json')
        cfgFile.text = """{
  "gamePath": "${relTo(dexWorkDir, gameJar)}",
  "d8Path": "${relTo(dexWorkDir, d8Jar)}",
  "androidLibPath": "${relTo(dexWorkDir, androidJar)}",
  "plugins": [
    "${relTo(dexWorkDir, pluginJar.get().asFile)}"
  ]
}
"""

        // loaderCli 可能带传递依赖(asm/mixin 等),只取 loader 本体那个可执行 jar
        def loaderArtifact = configurations.loaderCli.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'com.github.Finality-Framework' && it.moduleVersion.id.name == 'loader'
        }
        if (loaderArtifact == null) {
            throw new GradleException('cannot resolve the Finality loader artifact from JitPack')
        }
        def loaderJar = loaderArtifact.file
        def produced = new File(dexWorkDir, 'game.dex.zip')
        if (produced.exists()) produced.delete()

        logger.lifecycle("[dex] loader: ${loaderJar.name}")
        def javaExe = jdkExe(dexJavaHome, 'java')
        if (!javaExe.exists() || (!isJdk(dexJavaHome) && currentJvmMajor < 11)) {
            throw new GradleException("需要 JDK 11+ 来出 dex。\n" +
                    "  装一个 JDK 11，或用 -PjdkHome=<JDK目录> / AOH_JDK 指定；" +
                    "当前 Gradle JVM: ${System.getProperty('java.home')}")
        }
        logger.lifecycle("[dex] java: ${javaExe.absolutePath}")
        def pb = new ProcessBuilder(javaExe.absolutePath, '-jar', loaderJar.absolutePath,
                '--launch-mode', 'patch', '--patch-config', cfgFile.absolutePath)
        pb.directory(dexWorkDir)
        // 不用 inheritIO：输出重定向到文件，避免终端/后台任务不消费导致管道写满、“构建卡死”
        def logFile = new File(project.layout.buildDirectory.get().asFile, 'dex/loader.log')
        logFile.parentFile.mkdirs()
        pb.redirectErrorStream(true)
        pb.redirectOutput(ProcessBuilder.Redirect.to(logFile))
        logger.lifecycle("[dex] log: ${logFile}")
        def proc = pb.start()
        def code = proc.waitFor()
        def logLines = logFile.exists() ? logFile.readLines('UTF-8') : []
        logLines.takeRight(30).each { logger.lifecycle("  | ${it}") }
        if (code != 0) {
            throw new GradleException("loader patch mode failed (exit ${code})；完整日志: ${logFile}")
        }
        if (!produced.exists()) {
            throw new GradleException("loader did not produce game.dex.zip (see ${dexWorkDir})")
        }
        copy {
            from produced
            into dexOutDir
        }
        logger.lifecycle("[dex] out/game.dex.zip (${produced.length()} bytes)")
    }
}

tasks.named('build') {
    dependsOn tasks.named('dex')
}

